<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOOL TÀI XỈU MINHIOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1 class="login-title">TOOL TÀI XỈU BONIOS</h1>
    <p class="login-sub"><i class="fa-solid fa-shield-halved"></i> <span id="subText">Đang kiểm tra...</span></p>
    <div class="login-avatar">
      <div class="login-avatar-ring"></div>
      <img id="loginAvatarImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect fill='%230f1115' width='200' height='200'/><text x='50%25' y='56%25' font-size='90' text-anchor='middle' dominant-baseline='middle'>🎀</text></svg>">
      <div class="login-online-dot"></div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">ĐĂNG NHẬP</button>
      <button class="auth-tab" id="tabReg" onclick="switchTab('reg')">ĐĂNG KÝ</button>
    </div>
    <div id="formLogin">
      <div class="login-input-group"><i class="fa-solid fa-envelope icon-left"></i><input type="email" id="loginEmail" placeholder="Email..."></div>
      <div class="login-input-group"><i class="fa-solid fa-lock icon-left"></i><input type="password" id="loginPass" placeholder="Mật khẩu..."></div>
      <button class="login-btn" onclick="doLogin()"><span class="login-spinner" id="loginSpinner"></span><span id="btnLoginText"><i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP</span></button>
    </div>
    <div id="formReg" style="display:none">
      <div class="login-input-group"><i class="fa-solid fa-user icon-left"></i><input type="text" id="regName" placeholder="Tên hiển thị..."></div>
      <div class="login-input-group"><i class="fa-solid fa-envelope icon-left"></i><input type="email" id="regEmail" placeholder="Email..."></div>
      <div class="login-input-group"><i class="fa-solid fa-lock icon-left"></i><input type="password" id="regPass" placeholder="Mật khẩu..."></div>
      <div class="login-input-group"><i class="fa-solid fa-lock icon-left"></i><input type="password" id="regPass2" placeholder="Nhập lại mật khẩu..."></div>
      <button class="login-btn" onclick="doRegister()"><span class="login-spinner" id="regSpinner"></span><span id="btnRegText"><i class="fa-solid fa-user-plus"></i> ĐĂNG KÝ</span></button>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="login-success" id="successMsg"></div>
    <p class="login-footer">© TOOL • BONIOS 2026</p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
